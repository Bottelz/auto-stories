name: Daily Stories

on:
  schedule:
    # Paleidimo laikas nurodomas UTC. GitHub cron NEZINO Lietuvos laiko.
    # Vasara (EEST = UTC+3): 06:00 UTC  -> 09:00 Lietuvoje
    # Ziema (EET  = UTC+2): 07:00 UTC  -> 09:00 Lietuvoje
    # Jei nori kito laiko - pakeisk skaicius zemiau (formatas: minute valanda * * *).
    - cron: "0 6 * * *"
  workflow_dispatch:      # leidzia paleisti RANKINIU BUDU is Actions skirtuko
    inputs:
      source:
        description: "Is kurio aplanko imti nuotraukas"
        type: choice
        default: source2
        options:
          - source
          - source2

permissions:
  contents: write   # leidzia Action'ui issaugoti apdorotus paveikslelius atgal i repa

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Parsisiusti repozitorija
        uses: actions/checkout@v4

      - name: Idiegti Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Idiegti priklausomybes
        run: pip install -r requirements.txt

      - name: Paruosti paveikslelius (source/ -> media/, 1080x1920)
        run: python prepare_images.py
        env:
          # Rankiniam paleidimui - is pasirinkto aplanko; cron'ui (9:00 LT) - 'source2'
          SOURCE_DIR: ${{ github.event.inputs.source || 'source2' }}
          IMAGE_FILL_MODE: contain   # contain = visas vaizdas + fonas; cover = pilnas remas (apkarpo)

      - name: Issaugoti apdorotus paveikslelius atgal i repa
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media
          if git diff --staged --quiet; then
            echo "Pakeitimu media/ nera - praleidziu."
          else
            git commit -m "Auto: apdoroti story paveiksleliai (1080x1920)"
            git push
            echo "Palaukiam, kol raw URL atsinaujins..."
            sleep 10
          fi

      - name: Paskelbti story
        run: python post_stories.py
        env:
          GRAPH_VERSION: v23.0
          ENABLE_IG: "true"
          ENABLE_FB: "true"
          STORIES_PER_RUN: "50"   # kiek atsitiktiniu nuotrauku kelti per paleidima
          DELAY_BETWEEN: "5"      # pauze sekundemis tarp paskelbimu
          # IG: jei IG susietas su FB puslapiu -> palik graph.facebook.com.
          #     jei NESUSIETAS (Instagram Login) -> keisk i graph.instagram.com
          IG_GRAPH_HOST: graph.facebook.com
          IG_USER_ID:           ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN:      ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID:           ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          # MEDIA_BASE_URL nenustatomas -> naudojamas GitHub raw URL (repas turi buti VIESAS).
          # Jei paveikslelius laikai kitur (savo serveryje/S3) - iskomentuok ir nurodyk:
          # MEDIA_BASE_URL: https://tavo-serveris.lt/story-paveiksleliai
