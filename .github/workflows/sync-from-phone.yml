name: Sync from phone

# Veidrodiskai perkelia telefono galerijos albuma (per Google Drive) i repo source/.
# Drive aplankas pildomas telefono "Autosync for Google Drive" (dvikryptis, su trynimu).
# Sis workflow tik sinchronizuoja source/ - story kelia atskiras "Daily Stories" workflow.

on:
  schedule:
    # Kas 6 val. (UTC): 03, 09, 15, 21. Laikas paslinktas, kad nesutaptu su
    # kasdieniu kelimu (06:00 UTC) ir nesusidurtu git push'ai.
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch:   # leidzia paleisti RANKINIU BUDU is Actions skirtuko

permissions:
  contents: write   # leidzia issaugoti pakeitimus atgal i repa

# Serializuojam su "Daily Stories" - kad du workflow'ai neraso i repa vienu metu.
concurrency:
  group: repo-content-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Parsisiusti repozitorija
        uses: actions/checkout@v4

      - name: Idiegti rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Atkurti rclone konfiguracija is Secret
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF_B64 }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Sinchronizuoti Google Drive -> source/ (mirror, su trynimu)
        run: bash sync_from_cloud.sh

      - name: Issaugoti pakeitimus i repa
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A source
          if git diff --staged --quiet; then
            echo "Pakeitimu source/ nera - telefonas nepasikeite."
          else
            git commit -m "Auto: sinchronizuota is telefono (Google Drive -> source/)"
            git pull --rebase --autostash origin main || true
            git push
          fi
